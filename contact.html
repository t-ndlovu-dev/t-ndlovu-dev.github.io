<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – T. Ndlovu</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.3rem; }
        input, select, textarea {
            width: 100%; padding: 0.6rem;
            border: 1px solid #cbd5e1; border-radius: 6px;
            font-family: inherit; font-size: 1rem; box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .error { color: #dc2626; font-size: 0.85rem; margin-top: 0.2rem; }
        button[type="submit"] {
            background: #2563eb; color: white;
            padding: 0.75rem 2rem; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            width: 100%; transition: background 0.3s;
        }
        button[type="submit"]:hover { background: #1d4ed8; }
        .radio-group label, .checkbox-group label {
            display: inline-block; margin-right: 1rem; font-weight: normal;
        }
        input[type="radio"], input[type="checkbox"] { width: auto; margin-right: 0.3rem; }
    </style>
</head>
<body>
    <header>
        <h1>T. Ndlovu</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="code-playground/">Code Playground</a></li>
                <li><a href="team.html">Team Work</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Get in Touch</h2>
        <p>Fill in the form below and I'll get back to you. This form includes client‑side validation written in JavaScript.</p>

        <form id="contactForm" action="#" method="post" novalidate>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Your full name" required>
                <div class="error" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
                <div class="error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="reason">Reason for Contact</label>
                <select id="reason" name="reason" required>
                    <option value="">-- Select a reason --</option>
                    <option value="job">Job Opportunity</option>
                    <option value="project">Project Collaboration</option>
                    <option value="other">Other</option>
                </select>
                <div class="error" id="reasonError"></div>
            </div>

            <div class="form-group">
                <label>Preferred Contact Time</label>
                <div class="radio-group">
                    <label><input type="radio" name="time" value="morning"> Morning</label>
                    <label><input type="radio" name="time" value="afternoon"> Afternoon</label>
                </div>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" name="subscribe"> Subscribe to my newsletter (coming soon)
                </label>
            </div>

            <div class="form-group">
                <label for="message">Your Message (min. 10 characters)</label>
                <textarea id="message" name="message" rows="5" placeholder="Tell me about your project or opportunity..."></textarea>
                <div class="error" id="messageError"></div>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 T. Ndlovu | <a href="mailto:t.ndlovu.dev@proton.me">Email Me</a> | <a href="privacy.html">Privacy</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
